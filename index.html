<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jovem Impacto ODS 2030</title>
    <meta name="description" content="Notícias sobre meio ambiente, saúde e empregabilidade, feitas por jovens para jovens do Sudoeste Baiano.">

    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/sections.css">
</head>
<body>
    <header class="main-header">
        <div class="container-header">
            <img src="./assets/logo/logo-projeto-jovem-impacto.png" alt="Logo do projeto: Um sol nascente com 17 raios, cada um representando um ODS.">
            <a href="#" class="logo-text">Jovem Impacto</a>

            <nav class="nav-bar">
                <ul>
                    <li><a href="#home">HOME</a></li>
                    <li><a href="#sobre">SOBRE</a></li>
                    <li><a href="#temas">TEMAS</a></li>
                    <li><a href="#contato">CONTATO</a></li>
                </ul>
            </nav>

            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-solid fa-bars"></i>
        </div>
    </header>
    <main>
        <section id="home" class="hero">
            <div class="hero-container">
                <h1 class="hero-titulo">O mundo muda. E a nossa cidade?</h1>
                <p>Notícias sobre meio ambiente, saúde, sociedade & empregabilidade.</p>
                <button class="conferir-materias-btn">conferir matérias</button>
                <article class="card-noticia-principal">
                    <p class="card-noticia-principal-tema">empregabilidade</p>
                    <h2 class="card-noticia-principal-titulo">Titulo da notícia</h2>
                    <p class="card-noticia-principal-subtitulo">Subtitulo da notícia</p>
                    <i class="fa-solid fa-clock"></i>
                    <p class="tempo-leitura">5 min</p>
                    <button class="ver-agora-btn">ver agora</button>
                </article>
            </div>
        </section>
    </main>

    <footer></footer>

    <script src="js/menu.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
